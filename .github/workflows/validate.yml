name: Stack prüfen

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compose-Datei prüfen
        env:
          GRAFANA_ADMIN_PASSWORD: nur-fuer-den-test
        run: docker compose config --quiet

      - name: Prometheus-Konfiguration und Alarmregeln prüfen
        run: |
          docker run --rm -v "$PWD/prometheus:/etc/prometheus:ro" --entrypoint promtool \
            prom/prometheus:latest check config /etc/prometheus/prometheus.yml

      - name: Grafana-Dashboards prüfen (gültiges JSON)
        run: for f in grafana/dashboards/*.json; do python3 -m json.tool "$f" > /dev/null && echo "OK: $f"; done
